<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stereo 3D Clock</title>
<style>
  :root{
    --bg: #060a10; --panel: #0c131c; --panel-2: #0f1822; --line: #1b2733;
    --text: #d7e4ea; --muted: #64798a; --teal: #4fd8c4; --amber: #e8a33d;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0;
    background: var(--bg); color: var(--text);
    font-family: "IBM Plex Mono", "Space Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  #menu{ width: min(480px, 92vw); margin: 0 auto; padding: 40px 0 60px; }
  .card{
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    padding: 32px 32px 28px; position: relative;
  }
  .card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
  h1{ font-size: 22px; font-weight: 500; letter-spacing: .01em; margin:0; color: var(--text); }
  .help-btn{
    width:30px; height:30px; flex:none; background: var(--panel-2); color: var(--teal);
    border: 1px solid var(--line); border-radius: 3px; font-size: 15px; font-weight: 600;
    font-family: inherit; cursor: pointer;
  }
  .field{ margin-bottom: 22px; }
  .field-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom: 8px; }
  .field-head label{ font-size: 13px; color: var(--text); }
  .readout{ font-size: 13px; color: var(--amber); min-width: 34px; text-align:right; }
  input[type="range"]{
    -webkit-appearance:none; appearance:none; width:100%; height: 2px;
    background: var(--line); border-radius:1px;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:14px; height:14px; border-radius:2px;
    background: var(--teal); cursor:pointer; border: 1px solid #06120f;
  }
  input[type="range"]::-moz-range-thumb{
    width:14px; height:14px; border-radius:2px; background: var(--teal); cursor:pointer; border: 1px solid #06120f;
  }
  select{
    width:100%; padding: 9px 10px; font-size: 13px; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 3px; font-family: inherit;
  }
  .check-row{
    display:flex; align-items:center; gap:10px; padding: 10px 12px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px;
  }
  .check-row input{ width:15px; height:15px; accent-color: var(--teal); }
  .check-row label{ font-size: 13px; cursor:pointer; }
  .start-btn{
    width:100%; margin-top: 8px; padding: 13px 16px; font-size: 13px; letter-spacing:.06em;
    text-transform:uppercase; background: var(--teal); color: #06120f; font-weight:600;
    border:none; border-radius: 3px; cursor:pointer; font-family: inherit;
  }
  .credit{ margin-top: 16px; font-size: 11px; color: var(--muted); text-align:center; }
  #help{
    position: fixed; inset: 0; z-index: 100; background: rgba(3,6,10,0.78);
    display:flex; align-items:center; justify-content:center;
  }
  #help[hidden]{ display:none; }
  .help-card{
    width: min(420px, 92vw); background: var(--panel); border: 1px solid var(--line);
    border-radius: 4px; padding: 24px 28px 26px;
  }
  .help-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .help-head h2{ font-size:16px; font-weight:500; margin:0; color:var(--text); letter-spacing:.02em; }
  .help-close{
    width:28px; height:28px; background:var(--panel-2); color:var(--muted);
    border:1px solid var(--line); border-radius:3px; font-size:16px; line-height:1;
    cursor:pointer; font-family:inherit;
  }
  .hotkeys{ width:100%; border-collapse:collapse; margin-bottom:20px; }
  .hotkeys td{ padding:7px 4px; font-size:12.5px; border-bottom:1px solid var(--line); vertical-align:middle; }
  .hotkeys tr:last-child td{ border-bottom:none; }
  .hotkeys td:first-child{ width:150px; color:var(--muted); white-space:nowrap; }
  kbd{
    display:inline-block; min-width:20px; text-align:center; padding:2px 6px; font-size:11px;
    font-family:inherit; background:var(--panel-2); color:var(--teal);
    border:1px solid var(--line); border-bottom-width:2px; border-radius:3px;
  }
  .copy-btn{
    width:100%; padding:11px 14px; font-size:12px; letter-spacing:.05em; text-transform:uppercase;
    background:var(--panel-2); color:var(--teal); font-weight:600; border:1px solid var(--teal);
    border-radius:3px; cursor:pointer; font-family:inherit;
  }
  .copy-note{ margin:10px 0 0; font-size:11px; color:var(--amber); text-align:center; min-height:14px; overflow-wrap:break-word; word-break:break-all; }
  #player{ position: fixed; inset:0; width:100%; height:100%; background:#000; }
  #player[hidden]{ display:none; }
  #output{ display:block; width:100%; height:100%; }
  #player.cursor-hidden, #player.cursor-hidden *{ cursor:none; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
  <div id="menu">
    <div class="card">
      <div class="card-head">
        <h1>Stereo 3D Clock</h1>
        <button class="help-btn" id="helpBtn" title="Help">?</button>
      </div>
      <div class="field">
        <div class="field-head"><label for="depth">Depth</label><span class="readout" id="depthVal">100%</span></div>
        <input type="range" id="depth" min="0" max="200" value="100">
      </div>
      <div class="field">
        <div class="field-head"><label for="convergence">Convergence</label><span class="readout" id="convVal">100%</span></div>
        <input type="range" id="convergence" min="0" max="200" value="100">
      </div>
      <div class="field">
        <div class="field-head"><label for="clocksize">Clock text size</label><span class="readout" id="clockSizeVal">100%</span></div>
        <input type="range" id="clocksize" min="0" max="200" value="100" step="1">
      </div>
      <div class="field">
        <div class="field-head"><label for="scene">Scene</label></div>
        <select id="scene">
          <option value="deepspace">Deep Space</option>
          <option value="neongrid">Neon Grid</option>
          <option value="cityskyline">City Skyline</option>
          <option value="snowfall">Snowfall</option>
          <option value="bubbles">Bubbles</option>
          <option value="tunnel">Star Tunnel</option>
          <option value="aurora">Aurora</option>
          <option value="dunes">Desert Dunes</option>
          <option value="fireflies">Fireflies</option>
          <option value="matrix">The Matrix</option>
        </select>
      </div>
      <div class="field">
        <div class="field-head"><label for="format">Output format</label></div>
        <select id="format">
          <option value="interlaced">Interlaced</option>
          <option value="htab">Half TAB</option>
          <option value="hsbs">Half SBS</option>
        </select>
      </div>
      <div class="field">
        <div class="check-row">
          <input type="checkbox" id="swapEyes">
          <label for="swapEyes">Swap eyes</label>
        </div>
      </div>
      <button class="start-btn" id="startBtn">Start</button>
      <p class="credit">Made by: NTM-3D</p>
    </div>
  </div>

  <div id="help" hidden>
    <div class="help-card">
      <div class="help-head">
        <h2>Controls</h2>
        <button class="help-close" id="helpClose">&times;</button>
      </div>
      <table class="hotkeys">
        <tr><td><kbd>OK</kbd>/<kbd>Enter</kbd></td><td>Cycle what &uarr;/&darr; adjusts</td></tr>
        <tr><td><kbd>&uarr;</kbd> / <kbd>&darr;</kbd></td><td>Adjust selected (Depth / Convergence / Text size)</td></tr>
        <tr><td><kbd>1</kbd>/<kbd>2</kbd> <kbd>3</kbd>/<kbd>4</kbd> <kbd>5</kbd>/<kbd>6</kbd></td><td>Text size / Depth / Convergence shortcuts</td></tr>
        <tr><td><kbd>&larr;</kbd> / <kbd>&rarr;</kbd></td><td>Previous / next scene</td></tr>
        <tr><td><kbd>F</kbd></td><td>Fullscreen on / off</td></tr>
        <tr><td><kbd>Esc</kbd></td><td>Exit to menu</td></tr>
      </table>
      <button class="copy-btn" id="copyUrlBtn">Copy auto URL</button>
      <p class="copy-note" id="copyNote"></p>
    </div>
  </div>

  <div id="player" hidden>
    <canvas id="output"></canvas>
  </div>

<script>
(function(){
  "use strict";
  const menu = document.getElementById('menu');
  const player = document.getElementById('player');
  const outputCanvas = document.getElementById('output');
  const outCtx = outputCanvas.getContext('2d');
  const depthSlider = document.getElementById('depth');
  const convSlider = document.getElementById('convergence');
  const clockSizeSlider = document.getElementById('clocksize');
  const sceneSelect = document.getElementById('scene');
  const formatSelect = document.getElementById('format');
  const swapEyesBox = document.getElementById('swapEyes');
  const depthVal = document.getElementById('depthVal');
  const convVal = document.getElementById('convVal');
  const clockSizeVal = document.getElementById('clockSizeVal');
  const startBtn = document.getElementById('startBtn');
  const help = document.getElementById('help');
  const helpBtn = document.getElementById('helpBtn');
  const helpClose = document.getElementById('helpClose');
  const copyUrlBtn = document.getElementById('copyUrlBtn');
  const copyNote = document.getElementById('copyNote');

  depthSlider.addEventListener('input', () => depthVal.textContent = depthSlider.value + '%');
  convSlider.addEventListener('input', () => convVal.textContent = convSlider.value + '%');
  clockSizeSlider.addEventListener('input', () => clockSizeVal.textContent = clockSizeSlider.value + '%');

  function moveFocus(dir) {
    const focusables = Array.from(menu.querySelectorAll('button, input, select'));
    const idx = focusables.indexOf(document.activeElement);
    if (idx === -1) return;
    const next = idx + dir;
    if (next >= 0 && next < focusables.length) focusables[next].focus();
  }
  [depthSlider, convSlider, clockSizeSlider].forEach(sl => {
    sl.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') { e.preventDefault(); moveFocus(-1); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); moveFocus(1); }
    });
  });

  helpBtn.addEventListener('click', () => { help.hidden = false; });
  helpClose.addEventListener('click', () => { help.hidden = true; });
  help.addEventListener('click', (e) => { if (e.target === help) help.hidden = true; });

  function buildAutoUrl() {
    const p = new URLSearchParams();
    p.set('depth', depthSlider.value);
    p.set('convergence', convSlider.value);
    p.set('clocksize', clockSizeSlider.value);
    p.set('scene', sceneSelect.value);
    p.set('format', formatSelect.value);
    if (swapEyesBox.checked) p.set('swap', '1');
    p.set('auto', '1');
    const base = location.href.split('?')[0].split('#')[0];
    return base + '?' + p.toString();
  }
  copyUrlBtn.addEventListener('click', () => {
    const url = buildAutoUrl();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(() => {
        copyNote.textContent = 'Copied to clipboard';
        setTimeout(() => copyNote.textContent = '', 2200);
      }).catch(() => { copyNote.textContent = url; });
    } else { copyNote.textContent = url; }
  });

  (function parseArgs(){
    const q = new URLSearchParams(location.search);
    const num = k => { const v = parseFloat(q.get(k)); return isNaN(v) ? null : Math.round(v); };
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    let v;
    v = num('depth');       if (v !== null) { depthSlider.value = clamp(v, 0, 200); depthVal.textContent = depthSlider.value + '%'; }
    v = num('convergence'); if (v !== null) { convSlider.value = clamp(v, 0, 200); convVal.textContent = convSlider.value + '%'; }
    v = num('clocksize');   if (v !== null) { clockSizeSlider.value = clamp(v, 0, 200); clockSizeVal.textContent = clockSizeSlider.value + '%'; }
    const validScenes = Array.from(sceneSelect.options).map(o => o.value);
    const validFormats = Array.from(formatSelect.options).map(o => o.value);
    if (validScenes.indexOf(q.get('scene')) !== -1)   sceneSelect.value = q.get('scene');
    if (validFormats.indexOf(q.get('format')) !== -1) formatSelect.value = q.get('format');
    if (q.get('swap') === '1' || q.get('swap') === 'true') swapEyesBox.checked = true;
    if (q.get('auto') === '1' || q.get('auto') === 'true') { setTimeout(startViewer, 100); }
  })();

  const leftBuf = document.createElement('canvas');
  const rightBuf = document.createElement('canvas');
  const leftCtx = leftBuf.getContext('2d');
  const rightCtx = rightBuf.getContext('2d');
  const interlaceMaskCanvas = document.createElement('canvas');
  interlaceMaskCanvas.width = 1; interlaceMaskCanvas.height = 2;
  (function(){ const mctx = interlaceMaskCanvas.getContext('2d'); mctx.fillStyle = '#fff'; mctx.fillRect(0, 1, 1, 1); })();
  const interlacePattern = outCtx.createPattern(interlaceMaskCanvas, 'repeat');

  const WORLD_W = 1920, WORLD_H = 1080, FOCAL = 1200;
  const Z_NEAR = 250, Z_FAR = 2600, CENTER_Z = (Z_NEAR + Z_FAR) / 2;
  const MAX_EYE_SEP = 130, DISPARITY_MIN_Z = 150;

  function clockSizeMultiplier(raw) {
    return raw <= 100 ? (1.0 + (raw / 100) * 1.0) : (2.0 + ((raw - 100) / 100) * 2.0);
  }
  function spreadX(z) { return (WORLD_W / 2) * (FOCAL + z) / FOCAL; }
  function spreadY(z) { return (WORLD_H / 2) * (FOCAL + z) / FOCAL; }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function wrapRangeFor(z) { return 2 * (WORLD_H / 2) * (FOCAL + z) / FOCAL * 1.4; }

  let depthPct = 100, convPct = 100, clockSizePct = 100;
  let sceneId = 'deepspace', format = 'interlaced', swapEyes = false, running = false;
  let frameInvConvZ = 0, frameEyeSep = 0;

  function project(x, y, z, w) {
    const resScaleX = w / WORLD_W;
    const resScaleY = outputCanvas.height / WORLD_H;
    const scale = FOCAL / (FOCAL + z);
    return { sx: (w / 2) + x * scale * resScaleX, sy: (outputCanvas.height / 2) + y * scale * resScaleY, scale: scale * resScaleX };
  }
  function disparityFor(z, w) {
    const resScale = w / WORLD_W;
    const zSafe = Math.max(z, DISPARITY_MIN_Z);
    return frameEyeSep * FOCAL * (frameInvConvZ - 1 / zSafe) * resScale;
  }
  function projectStereo(x, y, z, w, eyeSign) {
    const p = project(x, y, z, w);
    const d = disparityFor(z, w) * eyeSign * 0.5;
    return { sx: p.sx + d, sy: p.sy, scale: p.scale };
  }
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  // sortedItems must already be sorted descending by z (done once at scene-init time,
  // since these scenes' items have fixed z). Only the clock's z changes per frame, so we
  // just walk the static list and splice the clock draw in by comparison - no per-frame
  // array allocation or closure creation.
  function drawPresorted(sortedItems, ctx, eyeSign, t, w, h, dispatch, clockZ, drawClockHere) {
    let i = 0;
    const n = sortedItems.length;
    while (i < n && sortedItems[i].z > clockZ) { dispatch(ctx, eyeSign, t, w, h, sortedItems[i]); i++; }
    drawClockHere();
    while (i < n) { dispatch(ctx, eyeSign, t, w, h, sortedItems[i]); i++; }
  }

  const hud = { esc: { text: 'Esc to exit', opacity: 0 }, scene: { text: '', opacity: 0 }, param: { text: '', opacity: 0 } };
  const hudTimers = {};
  function showHud(name, text, duration) {
    hud[name].text = text; hud[name].opacity = 1;
    clearTimeout(hudTimers[name]);
    hudTimers[name] = setTimeout(() => { hud[name].opacity = 0; }, duration);
  }
  function drawHudText(ctx, text, x, y, fontSize, opacity) {
    ctx.font = '600 ' + fontSize.toFixed(1) + 'px "IBM Plex Mono", monospace';
    const tw = ctx.measureText(text).width;
    const padX = fontSize * 0.8, padY = fontSize * 0.5;
    ctx.globalAlpha = opacity;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(x - tw / 2 - padX, y - fontSize / 2 - padY, tw + padX * 2, fontSize + padY * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y);
    ctx.globalAlpha = 1;
  }
  function drawHud(ctx, w, h) {
    const s = w / WORLD_W, osdSize = 26 * s;
    if (hud.scene.opacity > 0) drawHudText(ctx, hud.scene.text, w / 2, h * 0.055, osdSize, hud.scene.opacity);
    if (hud.param.opacity > 0) drawHudText(ctx, hud.param.text, w / 2, h * 0.115, osdSize, hud.param.opacity);
    if (hud.esc.opacity > 0)   drawHudText(ctx, hud.esc.text,   w / 2, h * 0.95,  osdSize, hud.esc.opacity);
  }

  const GRID_Y = 560;

  const spaceStars = [];
  for (let i = 0; i < 340; i++) {
    const z = rand(Z_NEAR, Z_FAR);
    spaceStars.push({ x: rand(-1500, 1500), y: rand(-850, 850), z: z, r: rand(1.2, 3.6) });
  }

  const NEON_SUN_Z = 2400;
  const neonStars = [];
  for (let i = 0; i < 60; i++) neonStars.push({ x: rand(-1600, 1600), y: rand(-850, -180), z: rand(2000, Z_FAR), r: rand(0.8, 2.2), tw: rand(0.5, 2), ph: rand(0, 10) });
  const neonMonoliths = [
    { x: -680, z: 750, w: 80, h: 380, hue: 185 }, { x: 640, z: 1000, w: 95, h: 460, hue: 300 },
    { x: -1050, z: 1500, w: 115, h: 560, hue: 200 }, { x: 1000, z: 1850, w: 130, h: 620, hue: 320 },
    { x: -1350, z: 2250, w: 150, h: 680, hue: 190 }, { x: 1300, z: 2500, w: 165, h: 720, hue: 285 }
  ];
  const neonSortedItems = [];
  neonStars.forEach(s => neonSortedItems.push({ z: s.z, type: 'star', ref: s }));
  neonSortedItems.push({ z: NEON_SUN_Z, type: 'sun', ref: null });
  neonSortedItems.push({ z: NEON_SUN_Z - 50, type: 'glow', ref: null });
  neonMonoliths.forEach(m => neonSortedItems.push({ z: m.z, type: 'monolith', ref: m }));
  neonSortedItems.sort((a, b) => b.z - a.z);

  const CITY_HORIZON_Z = 2500;
  const cityStars = [];
  for (let i = 0; i < 110; i++) cityStars.push({ x: rand(-1700, 1700), y: rand(-800, -300), z: rand(2200, Z_FAR), r: rand(0.5, 1.6), tw: rand(0.4, 1.8), ph: rand(0, 10) });
  const cityBuildings = [];
  [ { z: 2350, color: '#131e30', n: 14, hMin: 120, hMax: 460, win: false, density: 0 },
    { z: 2000, color: '#0d1728', n: 12, hMin: 180, hMax: 620, win: false, density: 0 },
    { z: 1650, color: '#081120', n: 10, hMin: 240, hMax: 780, win: true, density: 0.32 },
    { z: 1300, color: '#050b18', n: 9,  hMin: 300, hMax: 920, win: true, density: 0.5 }
  ].forEach(band => {
    const spread = spreadX(band.z);
    let x = -spread * 1.05;
    while (x < spread * 1.05) {
      const bw = rand(90, 260), bh = rand(band.hMin, band.hMax);
      const cols = Math.max(2, Math.floor(bw / 34)), rows = Math.max(3, Math.floor(bh / 48));
      const windows = [];
      if (band.win) for (let c = 0; c < cols * rows; c++) windows.push(Math.random() < band.density);
      cityBuildings.push({ x: x + bw / 2, z: band.z + rand(-60, 60), w: bw, h: bh, cols, rows, windows, color: band.color, win: band.win, tall: bh > band.hMax * 0.8, flickerSeed: rand(0, 1000), warm: Math.random() < 0.65 });
      x += bw + rand(10, 60);
    }
  });
  const traffic = [];
  for (let i = 0; i < 26; i++) {
    const dir = i % 2 === 0 ? 1 : -1;
    traffic.push({ z: dir === 1 ? 1100 : 1160, offset: rand(0, 1), speed: rand(180, 320), dir, color: dir === 1 ? '255,240,200' : '255,80,70' });
  }
  const CITY_MOON_Z = Z_FAR - 300;
  const citySortedItems = [];
  cityStars.forEach(s => citySortedItems.push({ z: s.z, type: 'star', ref: s }));
  citySortedItems.push({ z: CITY_MOON_Z, type: 'moon', ref: null });
  citySortedItems.push({ z: Z_FAR + 100, type: 'ground', ref: null });
  citySortedItems.push({ z: Z_FAR + 90, type: 'cityglow', ref: null });
  cityBuildings.forEach(b => {
    citySortedItems.push({ z: b.z, type: 'building', ref: b });
    if (b.z < 1400) citySortedItems.push({ z: b.z - 0.5, type: 'reflection', ref: b });
  });
  citySortedItems.push({ z: 1090, type: 'traffic', ref: null });
  citySortedItems.sort((a, b) => b.z - a.z);

  const snowflakes = [];
  for (let i = 0; i < 320; i++) {
    const z = rand(Z_NEAR, Z_FAR), range = wrapRangeFor(z);
    snowflakes.push({ x: rand(-1600, 1600), z, y0: rand(-range / 2, range / 2), range, speed: rand(60, 160), swayAmp: rand(20, 90), swaySeed: rand(0, 10), r: rand(1.4, 14) });
  }
  const bubbles = [];
  for (let i = 0; i < 220; i++) {
    const z = rand(Z_NEAR, Z_FAR), range = wrapRangeFor(z);
    bubbles.push({ x: rand(-1500, 1500), z, y0: rand(-range / 2, range / 2), range, speed: rand(40, 130), swayAmp: rand(15, 60), swaySeed: rand(0, 10), r: rand(3, 30), hue: rand(160, 320) });
  }
  const tunnelStars = [];
  for (let i = 0; i < 260; i++) tunnelStars.push({ angle: rand(0, Math.PI * 2), offset: rand(0, 1), speed: rand(0.14, 0.3), hue: rand(0, 360), size: rand(2, 5) });

  const AURORA_RIDGE_Z = 2100;
  const auroraStars = [];
  for (let i = 0; i < 220; i++) {
    const z = rand(AURORA_RIDGE_Z + 150, Z_FAR);
    auroraStars.push({ x: rand(-1, 1) * spreadX(z) * 0.95, y: rand(-1, 1) * spreadY(z) * 0.9, z, r: rand(1.8, 3.8), tw: rand(0.4, 1.8), ph: rand(0, 10) });
  }
  const AURORA_SCHEMES = [
    { base: [132, 95, 60], top: [310, 80, 60] },
    { base: [145, 90, 58], top: [170, 85, 55] },
    { base: [160, 85, 55], top: [190, 80, 55] },
    { base: [126, 90, 58], top: [345, 78, 58] },
    { base: [138, 92, 60], top: [285, 75, 60] }
  ];
  const auroraRibbons = [];

      const alpha = 0.35 + 0.65 * p;
      const glowR = size * 3;
      const glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, glowR);
      glow.addColorStop(0, 'hsla(' + hue.toFixed(0) + ',90%,65%,' + (alpha * 0.9).toFixed(3) + ')');
      glow.addColorStop(1, 'hsla(' + hue.toFixed(0) + ',90%,65%,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(sx - glowR, sy - glowR, glowR * 2, glowR * 2);
      ctx.beginPath();
      ctx.fillStyle = 'hsla(' + hue.toFixed(0) + ',90%,65%,' + alpha.toFixed(3) + ')';
      ctx.arc(sx, sy, size, 0, Math.PI * 2); ctx.fill();
    }
    for (let i = 0; i < tunnelStars.length; i++) if (starZ(tunnelStars[i]) > clockZ) drawStar(tunnelStars[i]);
    drawClockHere();
    for (let i = 0; i < tunnelStars.length; i++) if (starZ(tunnelStars[i]) <= clockZ) drawStar(tunnelStars[i]);
  }

  function drawAuroraStar(ctx, eyeSign, t, w, st) {
    const p = projectStereo(st.x, st.y, st.z, w, eyeSign);
    const a = 0.35 + 0.5 * (0.5 + 0.5 * Math.sin(t * st.tw + st.ph));
    ctx.beginPath(); ctx.fillStyle = 'rgba(225,235,245,' + a.toFixed(3) + ')';
    ctx.arc(p.sx, p.sy, Math.max(0.8, st.r * p.scale), 0, Math.PI * 2); ctx.fill();
  }
  function drawAuroraRibbon(ctx, eyeSign, t, w, rb) {
    ctx.globalCompositeOperation = 'lighter';
    const half = spreadX(rb.z) * 1.15;
    const rays = 40, step = (half * 2) / rays;
    for (let k = 0; k <= rays; k++) {
      const wx = -half + k * step;
      const yBase = rb.baseY + Math.sin(wx * rb.freq + t * rb.speed + rb.phase) * rb.amp;
      const rayMod = 0.5 + 0.5 * Math.sin(wx * rb.rayFreq + t * rb.speed * 1.7 + rb.rayPhase);
      const intensity = rayMod * rayMod;
      if (intensity < 0.04) continue;
      const hgt = rb.rayHeight * (0.55 + 0.45 * rayMod);
      const pb = projectStereo(wx, yBase, rb.z, w, eyeSign);
      const pt = projectStereo(wx, yBase - hgt, rb.z, w, eyeSign);
      const a = 0.42 * intensity;
      const grad = ctx.createLinearGradient(pb.sx, pb.sy, pt.sx, pt.sy);
      grad.addColorStop(0, 'hsla(' + rb.base[0] + ',' + rb.base[1] + '%,' + rb.base[2] + '%,' + a + ')');
      grad.addColorStop(0.55, 'hsla(' + rb.base[0] + ',' + rb.base[1] + '%,' + (rb.base[2] - 8) + '%,' + (a * 0.45) + ')');
      grad.addColorStop(1, 'hsla(' + rb.top[0] + ',' + rb.top[1] + '%,' + rb.top[2] + '%,0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = Math.max(1.5, step * 0.7 * pb.scale);
      ctx.beginPath(); ctx.moveTo(pb.sx, pb.sy); ctx.lineTo(pt.sx, pt.sy); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  function drawAuroraRidge(ctx, eyeSign, w, h) {
    const ridgeHalf = spreadX(AURORA_RIDGE_Z) * 1.15;
    ctx.beginPath();
    for (let i = 0; i < auroraRidge.length; i++) {
      const pt = auroraRidge[i], x = -ridgeHalf + pt.xf * ridgeHalf * 2;
      const p = projectStereo(x, GRID_Y - pt.h, AURORA_RIDGE_Z, w, eyeSign);
      if (i === 0) ctx.moveTo(p.sx, p.sy); else ctx.lineTo(p.sx, p.sy);
    }
    ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath();
    ctx.fillStyle = '#050a10'; ctx.fill();
  }
  function drawAuroraItem(ctx, eyeSign, t, w, h, item) {
    if (item.type === 'star') drawAuroraStar(ctx, eyeSign, t, w, item.ref);
    else if (item.type === 'ribbon') drawAuroraRibbon(ctx, eyeSign, t, w, item.ref);
    else drawAuroraRidge(ctx, eyeSign, w, h);
  }
  function drawAurora(ctx, eyeSign, t, w, h, clockZ, drawClockHere) {
    vGrad(ctx, w, h, [[0, '#050914'], [0.6, '#030710'], [1, '#01030a']]);
    const washP = projectStereo(0, -200, 1300, w, eyeSign);
    const wash = ctx.createRadialGradient(washP.sx, washP.sy, 0, washP.sx, washP.sy, w * 0.75);
    wash.addColorStop(0, 'rgba(60,150,140,0.16)'); wash.addColorStop(1, 'rgba(60,150,140,0)');
    ctx.fillStyle = wash; ctx.fillRect(0, 0, w, h);
    drawPresorted(auroraSortedItems, ctx, eyeSign, t, w, h, drawAuroraItem, clockZ, drawClockHere);
  }

  function drawDuneSun(ctx, eyeSign, w) {
    const sunP = projectStereo(0, 40, DUNE_SUN_Z, w, eyeSign);
    const sunR = 260 * sunP.scale;
    ctx.beginPath(); ctx.fillStyle = 'rgba(255,214,150,0.9)';
    ctx.arc(sunP.sx, sunP.sy, sunR, 0, Math.PI * 2); ctx.fill();
  }
  function drawDuneLayer(ctx, eyeSign, w, h, layer) {
    const half = spreadX(layer.z) * 1.6;
    ctx.beginPath();
    for (let j = 0; j < layer.points.length; j++) {
      const pt = layer.points[j], x = -half + pt.xf * half * 2;
      const p = projectStereo(x, GRID_Y - pt.h, layer.z, w, eyeSign);
      if (j === 0) ctx.moveTo(p.sx, p.sy); else ctx.lineTo(p.sx, p.sy);
    }
    ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath();
    ctx.fillStyle = layer.color; ctx.fill();
  }
  function drawDuneItem(ctx, eyeSign, t, w, h, item) {
    if (item.type === 'sun') drawDuneSun(ctx, eyeSign, w);
    else drawDuneLayer(ctx, eyeSign, w, h, item.ref);
  }
  function drawDunes(ctx, eyeSign, t, w, h, clockZ, drawClockHere) {
    vGrad(ctx, w, h, [[0, '#2a1630'], [0.45, '#7a3a4a'], [0.7, '#e08a52'], [1, '#f6c98a']]);
    drawPresorted(duneSortedItems, ctx, eyeSign, t, w, h, drawDuneItem, clockZ, drawClockHere);
  }

  function drawFireflies(ctx, eyeSign, t, w, h, clockZ, drawClockHere) {
    vGrad(ctx, w, h, [[0, '#02140f'], [1, '#010805']]);
    function flyZ(f) { return f.z0 + Math.sin(t * f.fz + f.pz) * f.az; }
    function drawFly(f, z) {
      const x = f.x0 + Math.sin(t * f.fx + f.px) * f.ax;
      const y = f.y0 + Math.sin(t * f.fy + f.py) * f.ay;
      const p = projectStereo(x, y, z, w, eyeSign);
      const blink = 0.35 + 0.65 * Math.max(0, Math.sin(t * f.blinkF + f.blinkP));
      const r = Math.max(0.6, 4 * p.scale);
      const glowR = r * 3;
      const glow = ctx.createRadialGradient(p.sx, p.sy, 0, p.sx, p.sy, glowR);
      glow.addColorStop(0, 'hsla(' + f.hue.toFixed(0) + ',95%,65%,' + (blink * 0.9).toFixed(3) + ')');
      glow.addColorStop(1, 'hsla(' + f.hue.toFixed(0) + ',95%,65%,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(p.sx - glowR, p.sy - glowR, glowR * 2, glowR * 2);
      ctx.beginPath();
      ctx.fillStyle = 'hsla(' + f.hue.toFixed(0) + ',95%,65%,' + blink.toFixed(3) + ')';
      ctx.arc(p.sx, p.sy, r, 0, Math.PI * 2); ctx.fill();
    }
    for (let i = 0; i < fireflies.length; i++) { const z = flyZ(fireflies[i]); if (z > clockZ) drawFly(fireflies[i], z); }
    drawClockHere();
    for (let i = 0; i < fireflies.length; i++) { const z = flyZ(fireflies[i]); if (z <= clockZ) drawFly(fireflies[i], z); }
  }

  function drawMatrix(ctx, eyeSign, t, w, h, clockZ, drawClockHere) {
    fillBg(ctx, w, h, '#000');
    const flickerFrame = Math.floor(t * 6), resScaleY = h / WORLD_H;
    function drawGlyph(chIdx, dx, dy, size, alpha, head) {
      const atlas = head ? glyphAtlasHead : glyphAtlasGreen;
      const sx = (chIdx % ATLAS_COLS) * GLYPH_CELL, sy = Math.floor(chIdx / ATLAS_COLS) * GLYPH_CELL;
      const dest = size * GLYPH_SCALE;
      ctx.globalAlpha = alpha;
      ctx.drawImage(atlas, sx, sy, GLYPH_CELL, GLYPH_CELL, dx - dest / 2, dy - dest / 2, dest, dest);
    }
    function drawColumn(c, i) {
      let headY = ((c.y0 + t * c.speed) % c.range);
      if (headY > c.range / 2) headY -= c.range;
      const p0 = projectStereo(c.x, headY, c.z, w, eyeSign);
      const fontSize = Math.max(6, 26 * p0.scale);
      const yStep = c.spacing * (FOCAL / (FOCAL + c.z)) * resScaleY;
      let sy = p0.sy;
      for (let j = 0; j < c.trail; j++) {
        if (sy > -fontSize && sy < h + fontSize) {
          const fade = 1 - j / c.trail;
          const rnd = hashRand(c.seed + j * 13.1 + flickerFrame, i, j);
          const chIdx = Math.floor(rnd * MATRIX_CHARS.length);
          drawGlyph(chIdx, p0.sx, sy, fontSize, j === 0 ? fade : fade * 0.85, j === 0);
        }
        sy -= yStep;
      }
    }
    for (let i = 0; i < matrixColumns.length; i++) if (matrixColumns[i].z > clockZ) drawColumn(matrixColumns[i], i);
    ctx.globalAlpha = 1;
    drawClockHere();
    for (let i = 0; i < matrixColumns.length; i++) if (matrixColumns[i].z <= clockZ) drawColumn(matrixColumns[i], i);
    ctx.globalAlpha = 1;
  }

  const SCENES = { deepspace: drawDeepSpace, neongrid: drawNeonGrid, cityskyline: drawCitySkyline, snowfall: drawSnowfall, bubbles: drawBubbles, tunnel: drawTunnel, aurora: drawAurora, dunes: drawDunes, fireflies: drawFireflies, matrix: drawMatrix };
  const SCENE_ORDER = ['deepspace', 'neongrid', 'cityskyline', 'snowfall', 'bubbles', 'tunnel', 'aurora', 'dunes', 'fireflies', 'matrix'];
  const SCENE_LABELS = { deepspace: 'Deep Space', neongrid: 'Neon Grid', cityskyline: 'City Skyline', snowfall: 'Snowfall', bubbles: 'Bubbles', tunnel: 'Star Tunnel', aurora: 'Aurora', dunes: 'Desert Dunes', fireflies: 'Fireflies', matrix: 'The Matrix' };

  // Clock floats higher and closer so city buildings don't hide it.
  function clockWorldPos(t) {
    return { x: 460 * Math.sin(t * 0.13), y: -160 + 150 * Math.sin(t * 0.09 + 1.3), z: 750 + 250 * Math.sin(t * 0.07 + 2.1) };
  }
  // Clock is rendered in full stereo 3D (per-eye disparity).
  let frameNow = new Date();
  function drawClock(ctx, eyeSign, t, w) {
    const c = clockWorldPos(t);
    const timeStr = pad2(frameNow.getHours()) + ':' + pad2(frameNow.getMinutes()) + ':' + pad2(frameNow.getSeconds());
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const p = projectStereo(c.x, c.y, c.z, w, eyeSign);
    const fontSize = Math.max(14, 150 * p.scale * clockSizeMultiplier(clockSizePct));
    ctx.font = '600 ' + fontSize.toFixed(1) + 'px "IBM Plex Mono", monospace';
    ctx.fillStyle = '#eaf7f4';
    ctx.fillText(timeStr, p.sx, p.sy);
  }

  function renderEye(ctx, eyeSign, t) {
    const w = ctx.canvas.width, h = ctx.canvas.height;
    const clockZ = clockWorldPos(t).z;
    const drawClockHere = () => drawClock(ctx, eyeSign, t, w);
    const fn = SCENES[sceneId] || drawDeepSpace;
    fn(ctx, eyeSign, t, w, h, clockZ, drawClockHere);
    drawHud(ctx, w, h);
  }

  function resizeCanvases() {
    const dpr = window.devicePixelRatio || 1;
    const w = Math.max(2, Math.round(window.innerWidth * dpr));
    const h = Math.max(2, Math.round(window.innerHeight * dpr));
    [outputCanvas, leftBuf, rightBuf].forEach(c => { c.width = w; c.height = h; });
    outputCanvas.style.width = window.innerWidth + 'px';
    outputCanvas.style.height = window.innerHeight + 'px';
  }
  function composite() {
    const w = outputCanvas.width, h = outputCanvas.height;
    const L = swapEyes ? rightBuf : leftBuf, R = swapEyes ? leftBuf : rightBuf;
    if (format === 'hsbs') {
      outCtx.globalCompositeOperation = 'source-over';
      outCtx.drawImage(L, 0, 0, w, h, 0, 0, w / 2, h);
      outCtx.drawImage(R, 0, 0, w, h, w / 2, 0, w / 2, h);
    } else if (format === 'htab') {
      outCtx.globalCompositeOperation = 'source-over';
      outCtx.drawImage(L, 0, 0, w, h, 0, 0, w, h / 2);
      outCtx.drawImage(R, 0, 0, w, h, 0, h / 2, w, h / 2);
    } else {
      outCtx.globalCompositeOperation = 'source-over';
      outCtx.drawImage(R, 0, 0);
      outCtx.globalCompositeOperation = 'destination-in';
      outCtx.fillStyle = interlacePattern;
      outCtx.fillRect(0, 0, w, h);
      outCtx.globalCompositeOperation = 'destination-over';
      outCtx.drawImage(L, 0, 0);
      outCtx.globalCompositeOperation = 'source-over';
    }
  }
  function loop() {
    if (!running) return;
    const t = performance.now() / 1000;
    frameNow = new Date();
    frameInvConvZ = (1 / Z_NEAR) + ((1 / Z_FAR) - (1 / Z_NEAR)) * (convPct / 200);
    frameEyeSep = MAX_EYE_SEP * (depthPct / 200);
    renderEye(leftCtx, -1, t);
    renderEye(rightCtx, 1, t);
    composite();
    requestAnimationFrame(loop);
  }

  function requestFs(el) { const fn = el.requestFullscreen || el.webkitRequestFullscreen; if (fn) return fn.call(el); return Promise.resolve(); }
  function exitFs() { const fn = document.exitFullscreen || document.webkitExitFullscreen; if (fn && (document.fullscreenElement || document.webkitFullscreenElement)) return fn.call(document); }
  function isFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }

  let fsExitViaF = false;
  function onFsChange() {
    if (!isFullscreen()) {
      if (fsExitViaF) { fsExitViaF = false; } else { backToMenu(); }
    }
  }
  document.addEventListener('fullscreenchange', onFsChange);
  document.addEventListener('webkitfullscreenchange', onFsChange);

  let cursorTimer = null;
  function showCursor() {
    player.classList.remove('cursor-hidden');
    clearTimeout(cursorTimer);
    cursorTimer = setTimeout(() => player.classList.add('cursor-hidden'), 2200);
  }
  player.addEventListener('mousemove', showCursor);
  player.addEventListener('click', () => { if (running && !isFullscreen()) requestFs(player); });

  function backToMenu() {
    running = false;
    document.removeEventListener('keydown', onViewerKeydown);
    player.hidden = true;
    player.classList.remove('cursor-hidden');
    clearTimeout(cursorTimer);
    menu.hidden = false;
  }

  function startViewer() {
    depthPct = parseInt(depthSlider.value, 10);
    convPct = parseInt(convSlider.value, 10);
    clockSizePct = parseInt(clockSizeSlider.value, 10);
    sceneId = sceneSelect.value;
    format = formatSelect.value;
    swapEyes = swapEyesBox.checked;
    menu.hidden = true;
    player.hidden = false;
    resizeCanvases();
    running = true;
    document.addEventListener('keydown', onViewerKeydown);
    requestAnimationFrame(loop);
    const fsP = requestFs(player);
    if (fsP && typeof fsP.catch === 'function') fsP.catch(() => { showHud('param', 'Click for fullscreen', 4000); });
    showCursor();
    showHud('esc', 'Esc to exit', 3500);
  }
  startBtn.addEventListener('click', startViewer);

  function cycleScene(dir) {
    const idx = SCENE_ORDER.indexOf(sceneId);
    sceneId = SCENE_ORDER[(idx + dir + SCENE_ORDER.length) % SCENE_ORDER.length];
    sceneSelect.value = sceneId;
    showHud('scene', SCENE_LABELS[sceneId], 1400);
  }

  const PARAMS = [
    { label: 'Depth',       slider: depthSlider,     readout: depthVal,     apply: v => { depthPct = v; } },
    { label: 'Convergence', slider: convSlider,      readout: convVal,      apply: v => { convPct = v; } },
    { label: 'Text size',   slider: clockSizeSlider, readout: clockSizeVal, apply: v => { clockSizePct = v; } }
  ];
  let activeParam = 0;
  function adjustByIndex(idx, delta) {
    const p = PARAMS[idx];
    let v = parseInt(p.slider.value, 10) + delta;
    v = Math.max(0, Math.min(200, v));
    p.slider.value = v;
    p.readout.textContent = v + '%';
    p.apply(v);
    showHud('param', p.label + ' ' + v + '%', 1500);
  }
  function selectParamOSD() {
    const p = PARAMS[activeParam];
    showHud('param', p.label + ' ' + p.slider.value + '%', 1500);
  }

  function onViewerKeydown(e) {
    const k = e.key;
    if (k === 'Escape') { exitFs(); backToMenu(); }
    else if (k === 'Backspace' || k === 'GoBack' || k === 'BrowserBack') { e.preventDefault(); exitFs(); backToMenu(); }
    else if (k === 'ArrowRight') { e.preventDefault(); cycleScene(1); }
    else if (k === 'ArrowLeft') { e.preventDefault(); cycleScene(-1); }
    else if (k === 'Enter') { e.preventDefault(); activeParam = (activeParam + 1) % PARAMS.length; selectParamOSD(); }
    else if (k === 'ArrowUp') { e.preventDefault(); adjustByIndex(activeParam, 1); }
    else if (k === 'ArrowDown') { e.preventDefault(); adjustByIndex(activeParam, -1); }
    else if (k === 'f' || k === 'F') { e.preventDefault(); if (isFullscreen()) { fsExitViaF = true; exitFs(); } else { requestFs(player); } }
    else if (k === '1') { e.preventDefault(); adjustByIndex(2, -1); }
    else if (k === '2') { e.preventDefault(); adjustByIndex(2, 1); }
    else if (k === '3') { e.preventDefault(); adjustByIndex(0, -1); }
    else if (k === '4') { e.preventDefault(); adjustByIndex(0, 1); }
    else if (k === '5') { e.preventDefault(); adjustByIndex(1, -1); }
    else if (k === '6') { e.preventDefault(); adjustByIndex(1, 1); }
  }

  window.addEventListener('resize', () => { if (!player.hidden) resizeCanvases(); });
})();
</script>
</body>
</html>
